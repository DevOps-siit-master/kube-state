# Loki overrides for the local (kind) cluster.
#
# Single-binary deployment with filesystem storage and no object store or
# memcached caches — the smallest footprint that still ingests and serves
# logs, which is all a dev cluster needs.

deploymentMode: SingleBinary

loki:
  # No multi-tenancy on the dev cluster; every stream lands in one tenant.
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 168h  # keep 7 days of logs

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: standard
    size: 5Gi

# Scale-out read/write/backend components stay off in single-binary mode.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Memcached-backed caches are unnecessary (and heavy) for dev.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# A tiny gateway gives Promtail (and Grafana) one stable endpoint.
gateway:
  enabled: true
  replicas: 1

# Drop the canary DaemonSet and helm-test pod we don't need on kind.
lokiCanary:
  enabled: false
test:
  enabled: false
