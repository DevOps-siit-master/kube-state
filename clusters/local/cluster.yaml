# Metadata for the local development cluster.
apiVersion: kube-state/v1
kind: Cluster
metadata:
  name: local
spec:
  # Local Kubernetes distribution used for development.
  distribution: kind
  kubernetesVersion: "1.30"
  releases:
    - name: shop-operator
      namespace: shop-operator-system
    - name: shophub
      namespace: shophub
    - name: shophub-discord
      namespace: shophub
    # Logging stack (spec 4.1): Loki backend + Promtail shipper.
    - name: loki
      namespace: observability
    - name: promtail
      namespace: observability
